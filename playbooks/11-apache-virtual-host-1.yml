---
- name: Update package repositories
  hosts: all
  become: true
  pre_tasks:

  - name: Installing Updates
    tags: always
    ansible.builtin.dnf:
      update_only: true
      update_cache: true
    when: ansible_facts['os_family'] == "RedHat"

  - name: Update apt cache (Debian/Ubuntu only)
    tags: always
    ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
    when: ansible_facts['os_family'] == "Debian"

- name: Configure Apache Virtual Host
  hosts: webservers:centos
  become: true

  handlers:
    - name: Reload Apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: reloaded

  tasks:

    - name: Install Apache and PHP
      tags:
        - apache
        - website
      ansible.builtin.package:
        name:
          - "{{ apache_package }}"
          - "{{ php_package }}"
        state: present

    - name: Ensure Apache service is started and enabled
      tags:
        - apache
      ansible.builtin.service:
        name: "{{ apache_service }}"
        state: started
        enabled: true

    - name: Enable Apache headers module (Ubuntu)
      tags:
        - apache
        - website

      ansible.builtin.command:
        cmd: a2enmod headers

      register: headers_module

      changed_when: "'already enabled' not in headers_module.stdout"
      failed_when:
        - headers_module.rc != 0
        - "'already enabled' not in headers_module.stdout"

      when: ansible_facts.os_family == "Debian"

      notify: Reload Apache

    - name: Create Apache document root
      tags:
        - apache
        - website
      ansible.builtin.file:
        path: "{{ apache_document_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy infrastructure dashboard
      tags:
        - apache
        - website
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/dashboard.html.j2"
        dest: "{{ apache_document_root }}/index.html"
        owner: root
        group: root
        mode: "0644"
      
      notify: Reload Apache

    - name: Deploy Apache VirtualHost configuration
      tags:
        - apache
        - website

      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/infrastructure-dashboard.conf.j2"
        dest: "{{ apache_vhost_file }}"
        owner: root
        group: root
        mode: "0644"

      notify: Reload Apache

    - name: Enable infrastructure dashboard site (Ubuntu)
      tags:
        - apache
        - website
      ansible.builtin.file:
        src: "{{ apache_vhost_file }}"
        dest: "{{ apache_enabled_dir }}/infrastructure-dashboard.conf"
        state: link
        force: true
      when: ansible_facts.os_family == "Debian"
    
      notify: Reload Apache

    - name: Disable default Apache site (Ubuntu)
      tags:
        - apache
        - website

      ansible.builtin.file:
        path: /etc/apache2/sites-enabled/000-default.conf
        state: absent
      when: ansible_facts.os_family == "Debian"

      notify: Reload Apache

    - name: Validate Apache configuration
      tags:
        - apache

      ansible.builtin.command:
        cmd: "{{ apache_config_test }}"
      changed_when: false
